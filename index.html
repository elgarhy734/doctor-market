<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctor Market | اطلب بقالتك على واتساب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf6;--surface:#fff;--text:#12261b;--muted:#5d7466;--g:#0f9d58;--gd:#0a6b3c;--gl:#e3f5ea;--o:#ff8a1f;--line:#dcebe1;--shadow:0 10px 30px rgba(15,157,88,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1912;--surface:#15251c;--text:#e8f4ec;--muted:#9bb5a4;--gl:#1b3527;--line:#25402f;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1912;--surface:#15251c;--text:#e8f4ec;--muted:#9bb5a4;--gl:#1b3527;--line:#25402f;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.6}
.hero{background:linear-gradient(145deg,var(--gd),var(--g));color:#fff;padding:28px 20px 70px;text-align:center;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:220px;height:220px;top:-80px;left:-60px}
.hero::after{width:160px;height:160px;bottom:-50px;right:-40px}
.logo{width:74px;height:74px;margin:0 auto 10px;background:#fff;border-radius:22px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);position:relative;z-index:1}
.hero h1{margin:0;font-size:2rem;font-weight:900;position:relative;z-index:1}
.hero h1 span{color:#ffd9a8}
.hero p{margin:6px 0 0;opacity:.92;position:relative;z-index:1}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.badges b{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font-size:.82rem;font-weight:600}
main{max-width:640px;margin:-48px auto 0;padding:0 14px 40px;position:relative}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.card h2{margin:0 0 12px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.num{background:var(--g);color:#fff;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.85rem}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px var(--gl)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--gl);color:var(--gd);font:inherit;font-weight:700;padding:7px 14px;border-radius:99px;cursor:pointer}
.tab.on{background:var(--g);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1.5px dashed var(--g);background:transparent;color:var(--text);font:inherit;padding:6px 12px;border-radius:99px;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.94);background:var(--gl)}
.chip::before{content:"+ ";color:var(--g);font-weight:900}
.add{display:flex;gap:8px;margin-top:12px}
.add button,.send{border:0;font:inherit;font-weight:700;cursor:pointer}
.add button{background:var(--o);color:#fff;border-radius:14px;padding:0 18px}
.row{display:flex;gap:10px}.qtyf{flex:0 0 90px}.namef{flex:1}
.next{width:100%;margin-top:12px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--o);color:#fff;border-radius:14px;padding:12px}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
li .nm{flex:1;font-weight:600}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--gl);color:var(--gd);font-size:1.1rem;font-weight:900;cursor:pointer}
.q span{min-width:20px;text-align:center;font-weight:700}
.del{background:none;border:0;color:#e5484d;font-size:1.2rem;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:16px 0 4px}
.send{width:100%;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;font-size:1.1rem;padding:15px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(37,211,102,.35)}
.send:active{transform:scale(.98)}
.err{color:#e5484d;font-size:.88rem;margin-top:10px;text-align:center;min-height:1.2em}
.note{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px}
</style>
</head>
<body>
<header class="hero">
  <div class="logo">
    <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#0f9d58"/><path d="M20 11h8v9h9v8h-9v9h-8v-9h-9v-8h9z" fill="#fff"/></svg>
  </div>
  <h1 dir="ltr">Doctor <span>Market</span></h1>
  <p>اكتب طلباتك وهنوصلهالك لحد باب البيت</p>
  <div class="badges"><b>🚚 توصيل سريع</b><b>🛒 كل احتياجاتك</b><b>💬 اطلب عبر واتساب</b></div>
</header>

<main>
  <section class="card">
    <h2><span class="num">1</span> بياناتك</h2>
    <label for="name">الاسم</label>
    <input id="name" placeholder="اكتب اسمك" autocomplete="name">
    <label for="phone">رقم الموبايل</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" autocomplete="tel">
    <label for="addr">العنوان</label>
    <input id="addr" placeholder="الشارع / العمارة / الدور" autocomplete="street-address">
  </section>

  <section class="card">
    <h2><span class="num">2</span> قائمة طلباتك</h2>
    <div class="row">
      <div class="qtyf"><label for="qty">العدد</label><input id="qty" type="number" inputmode="numeric" min="1" value="1"></div>
      <div class="namef"><label for="pname">اسم المنتج</label><input id="pname" placeholder="مثال: رز"></div>
    </div>
    <button class="next" id="addBtn" type="button">التالي ＋</button>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <h2><span class="num">3</span> ملاحظات (اختياري)</h2>
    <textarea id="notes" rows="2" placeholder="مثال: الأرز يكون من النوع الفلاحي"></textarea>
  </section>

  <button class="send" id="send" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-2 .9-2.200.2-.3.5-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.2.1.400 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
    ابعت الطلب على واتساب
  </button>
  <div class="err" id="err" role="alert"></div>
  <div class="note">هيتفتح معاك واتساب برسالة جاهزة بطلبك، اضغط إرسال بس ✅</div>
</main>

<script>
// غيّر الرقم هنا برقم الواتساب بتاعك (بصيغة دولية بدون + ولا أصفار): مصر = 20 + الرقم بدون الصفر
var WA_NUMBER = "201007872376";

var items = [];
var $ = function(id){ return document.getElementById(id); };

function save(){ try{ localStorage.setItem("dm", JSON.stringify({n:$("name").value,p:$("phone").value,a:$("addr").value})); }catch(e){} }
function load(){ try{ var d = JSON.parse(localStorage.getItem("dm")||"{}"); $("name").value=d.n||""; $("phone").value=d.p||""; $("addr").value=d.a||""; }catch(e){} }

function addItem(){
  var name = $("pname").value.trim(), qty = parseInt($("qty").value,10);
  if(!name){ $("err").textContent = "اكتب اسم المنتج الأول"; $("pname").focus(); return false; }
  if(!qty || qty<1) qty = 1;
  $("err").textContent = "";
  items.push({name:name, qty:qty});
  $("pname").value = ""; $("qty").value = "1";
  render(); $("pname").focus();
  return true;
}

function render(){
  var ul = $("list"); ul.innerHTML = "";
  if(!items.length){ ul.innerHTML = '<div class="empty">🛒 القايمة فاضية، ضيف أصناف من فوق</div>'; return; }
  items.forEach(function(it, idx){
    var li = document.createElement("li");
    li.innerHTML = '<span class="nm"></span><div class="q"><button type="button" aria-label="زيادة">+</button><span>'+it.qty+'</span><button type="button" aria-label="نقصان">−</button></div><button class="del" type="button" aria-label="حذف">✕</button>';
    li.querySelector(".nm").textContent = it.name;
    var b = li.querySelectorAll(".q button");
    b[0].onclick = function(){ it.qty++; render(); };
    b[1].onclick = function(){ if(it.qty>1) it.qty--; render(); };
    li.querySelector(".del").onclick = function(){ items.splice(idx,1); render(); };
    ul.appendChild(li);
  });
}

$("addBtn").onclick = addItem;
$("pname").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); addItem(); } });
["name","phone","addr"].forEach(function(id){ $(id).addEventListener("input", save); });

$("send").onclick = function(){
  var name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim(), notes = $("notes").value.trim();
  var err = $("err"); err.textContent = ""; if($("pname").value.trim()) addItem();
  if(!name){ err.textContent = "من فضلك اكتب اسمك"; $("name").focus(); return; }
  if(phone.replace(/\D/g,"").length < 10){ err.textContent = "اكتب رقم موبايل صحيح"; $("phone").focus(); return; }
  if(!items.length){ err.textContent = "ضيف صنف واحد على الأقل في القايمة"; return; }
  var lines = ["🛒 *طلب جديد - Doctor Market*","","👤 الاسم: "+name,"📞 الموبايل: "+phone];
  if(addr) lines.push("📍 العنوان: "+addr);
  lines.push("","📝 *الطلبات:*");
  items.forEach(function(it,i){ lines.push((i+1)+". "+it.name+" × "+it.qty); });
  if(notes) lines.push("","💬 ملاحظات: "+notes);
  var url = "https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(lines.join("\n"));
  var w = null; try{ w = window.open(url,"_blank"); }catch(e){}
  if(!w) window.location.href = url;
};

load(); render();
</script>
</body>
</html>
